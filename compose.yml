# Local development/testing stack: a disposable Postgres + the
# tuva-ingest connector/dbt image built from ./Dockerfile. NOT for
# production use -- there is no TLS, no backup/HA, and no production
# secret management here; the Postgres credentials below are
# clearly-labeled, local-only placeholders that must never be reused
# outside a developer's own machine.
#
# One-command workflow (see the Makefile's `local-db-*`/`local-*`
# targets and README.md's "Local development" section for the full
# walkthrough):
#
#   make local-db-ready     # start postgres + minio, wait for health
#   make local-migrate      # apply operational migrations (001-006)
#   make local-dbt-deps     # fetch the pinned Tuva 0.18.0 package
#   make local-extract      # pull a snapshot via the ingestion API client
#   make local-load-raw     # load the snapshot into the raw schema
#   make local-dbt-build    # build+test staging -> Input Layer -> Tuva
#   make local-db-down      # stop containers, KEEP the data volume
#   make local-db-reset     # DESTRUCTIVE: drop the local data volume too
#
# `minio` is a disposable, local-only S3-compatible object store so the
# object-storage-backed extract/load path (OBJECT_STORAGE_PROVIDER=s3,
# OBJECT_STORAGE_ENDPOINT_URL=http://minio:9000 -- see
# src/tuva_ingest/object_storage/s3.py) can be exercised end to end
# without any real cloud credentials. It is entirely optional: every
# `local-db-*`/`local-*` target above still works with
# OBJECT_STORAGE_PROVIDER=local (the default -- see config.py), which
# never touches minio at all.
#
# Equivalent raw `docker compose` commands, if you'd rather not go
# through make:
#
#   docker compose up -d postgres                    # start just the database
#   docker compose run --rm migrate                  # apply operational migrations
#   docker compose run --rm dbt-deps                  # fetch dbt packages
#   docker compose run --rm ingest healthcheck
#   TUVA_API_MANIFEST_URL=... TUVA_API_TOKEN=... docker compose run --rm ingest run
#
# `ingest run`/`ingest extract` additionally require a real (or
# locally-mocked) TUVA_API_MANIFEST_URL -- this compose file does not
# stand one up, since the point of the manifest contract is that it's
# vendor-agnostic and this repo does not assume a specific upstream
# host. Neither `docker compose up` (bare) nor any `local-db-*` target
# ever requires TUVA_API_MANIFEST_URL/TUVA_API_TOKEN.
#
#   docker compose up -d minio                        # start the local S3-compatible store
#   docker compose run --rm minio-mc mb local/tuva-raw # create the local dev bucket (idempotent)

x-tuva-build: &tuva-build
  context: .
  dockerfile: Dockerfile

# Shared connection settings for every service that talks to the local
# database or dbt project. Defined once so the local-only DSN/schema
# names never drift between them -- all local-development-only values
# (see the POSTGRES_* block below), never production configuration.
x-tuva-db-env: &tuva-db-env
  PG_DSN: postgresql://tuva_local:local-only-example-password-change-me@postgres:5432/tuva
  RAW_SCHEMA: raw_incoming
  OPS_SCHEMA: ops
  STAGING_SCHEMA: staging_incoming
  INPUT_LAYER_SCHEMA: input_layer
  ANALYTICS_CORE_SCHEMA: analytics_core
  ANALYTICS_MARTS_SCHEMA: analytics_marts
  SOURCE_NAME: tuva

# Local-only S3-compatible object storage settings -- OPT-IN, only used
# by services that explicitly set OBJECT_STORAGE_PROVIDER=s3 (none do by
# default; see the `ingest` service below, which defaults to
# OBJECT_STORAGE_PROVIDER=local and never touches minio). No static
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY here on purpose --
# object_storage/s3.py authenticates via boto3's ambient credential
# chain, so MINIO_ROOT_USER/MINIO_ROOT_PASSWORD below are supplied to
# boto3 as ordinary AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY environment
# variables (boto3's own ambient-credential mechanism, not a
# connector-specific setting) only for this disposable local stack.
x-tuva-minio-env: &tuva-minio-env
  OBJECT_STORAGE_PROVIDER: s3
  OBJECT_STORAGE_BUCKET: tuva-raw-local
  OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
  OBJECT_STORAGE_REGION: us-east-1
  AWS_ACCESS_KEY_ID: tuva-local-minio
  AWS_SECRET_ACCESS_KEY: local-only-example-minio-secret-change-me

x-tuva-dbt-env: &tuva-dbt-env
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: tuva_local
  PGPASSWORD: local-only-example-password-change-me
  PGDATABASE: tuva
  DBT_SCHEMA: dbt_dev
  DBT_TARGET: dev
  DBT_PROFILES_DIR: /app
  DBT_PROJECT_DIR: /app

services:
  postgres:
    # Pinned to the same major version this repository's CI validates
    # against. Prefer a pinned tag over `latest` so local behavior stays
    # reproducible across machines and over time.
    image: postgres:16
    environment:
      # LOCAL-ONLY EXAMPLE CREDENTIALS -- never used outside this compose
      # file's disposable container. Do not reuse this password for
      # anything beyond a developer's own machine.
      POSTGRES_USER: tuva_local
      POSTGRES_PASSWORD: local-only-example-password-change-me
      POSTGRES_DB: tuva
    ports:
      # Loopback-only: never bind Postgres to all interfaces (0.0.0.0).
      # Host port is configurable (POSTGRES_PORT) so it doesn't collide
      # with a developer's own local Postgres already using 5432; the
      # *container* port always stays Postgres's normal 5432 regardless.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuva_local -d tuva"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Local-dev convenience only: restart if it crashes, but never loop
    # indefinitely trying to start (that's `on-failure`'s job, not
    # `always`, and this is explicitly not a production restart policy).
    restart: on-failure

  # Disposable, local-only S3-compatible object store (see
  # x-tuva-minio-env above and src/tuva_ingest/object_storage/s3.py).
  # Entirely optional -- `docker compose up` (bare) does not depend on
  # this service; start it explicitly (`docker compose up -d minio`)
  # only when exercising OBJECT_STORAGE_PROVIDER=s3 locally.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    environment:
      MINIO_ROOT_USER: tuva-local-minio
      MINIO_ROOT_PASSWORD: local-only-example-minio-secret-change-me
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      # Loopback-only, same convention as postgres above. 9000: S3 API.
      # 9001: web console (local development convenience only).
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: on-failure

  # One-shot: creates the local dev bucket (idempotent -- `mb --ignore-existing`).
  # `docker compose run --rm minio-mc mb local/tuva-raw-local`
  minio-mc:
    image: minio/mc:RELEASE.2024-01-13T11-05-29Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 tuva-local-minio local-only-example-minio-secret-change-me &&
        mc mb --ignore-existing local/tuva-raw-local
    restart: "no"

  # One-shot migration runner: applies migrations/001_operational_schemas.sql
  # through 006_object_storage_raw_contract.sql (see
  # src/tuva_ingest/migrations.py) against the local database, then
  # exits. Never creates or touches Tuva-managed core/terminology/output
  # schemas -- only the raw and operational-control namespaces (see
  # README.md "This repository does not own Tuva's DDL"). Idempotent and
  # safe to rerun; already-applied migrations are skipped.
  migrate:
    build: *tuva-build
    depends_on:
      postgres:
        condition: service_healthy
    environment: *tuva-db-env
    command: ["migrate"]
    restart: "no"

  # One-shot: fetches the pinned Tuva package (packages.yml, exactly
  # 0.18.0) plus dbt_utils. Requires network access to dbt Hub -- not
  # something `docker compose up` (bare) depends on, since it's only
  # needed before `dbt-build`/`ingest run`.
  dbt-deps:
    build: *tuva-build
    environment: *tuva-dbt-env
    volumes:
      - dbt-packages:/app/dbt_packages
    entrypoint: ["dbt"]
    command: ["deps"]
    restart: "no"

  # One-shot: builds+tests models/staging -> models/final (the Input
  # Layer contract) -> the Tuva package's own core/terminology/mart
  # models, against whatever is currently in the raw schema (loaded by
  # `ingest load-raw` / `ingest run`). Requires `dbt-deps` and `migrate`
  # to have completed successfully first.
  dbt-build:
    build: *tuva-build
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *tuva-dbt-env
    volumes:
      - dbt-packages:/app/dbt_packages
    entrypoint: ["dbt"]
    command:
      [
        "build",
        "--vars",
        "{raw_schema: raw_incoming, staging_schema: staging_incoming, input_layer_schema: input_layer, analytics_core_schema: analytics_core, analytics_marts_schema: analytics_marts, claims_enabled: true}",
      ]
    restart: "no"

  ingest:
    build: *tuva-build
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *tuva-db-env
      PIPELINE_ENVIRONMENT: local
      LOG_LEVEL: INFO
      RAW_DATA_DIR: /app/data/raw
      DBT_PROFILES_DIR: /app
      DBT_PROJECT_DIR: /app
      DBT_TARGET: dev
      # Not set here on purpose (see usage note above): TUVA_API_MANIFEST_URL,
      # TUVA_API_TOKEN, TUVA_API_SECRET_PROVIDER/TUVA_API_SECRET_ID/AWS_REGION.
      # Supply them on the command line or a local .env file (never
      # committed) to run `ingest extract`/`ingest sync`/`ingest run` end
      # to end. The default TUVA_API_SECRET_PROVIDER (env) needs only
      # TUVA_API_TOKEN; TUVA_API_SECRET_PROVIDER=aws additionally needs
      # ambient AWS credentials mounted/available to the container (this
      # compose file does not configure that -- it is a local-only setup).
    volumes:
      - raw-data:/app/data/raw
      - dbt-packages:/app/dbt_packages
    # Safe default for `docker compose up`: only needs the database,
    # never the (unset-by-default) API credentials. Override with `run`
    # or `extract --endpoint <name>` (see README.md) once
    # TUVA_API_MANIFEST_URL/TUVA_API_TOKEN are supplied.
    command: ["healthcheck"]
    restart: "no"

volumes:
  pgdata:
  raw-data:
  dbt-packages:
  minio-data:
