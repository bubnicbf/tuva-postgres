name: CI (tuva-ingest connector + dbt)

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install locked Python tooling (ruff, mypy, pytest, sqlfluff, pre-commit, dbt)
        run: uv sync --locked

      - name: Verify locked Python toolchain
        run: make check-python-deps

      - name: Lint Python (ruff check)
        run: make lint-python

      - name: Check Python formatting (ruff format --check)
        run: make format-python-check

      - name: Type check Python (mypy)
        run: make typecheck

      - name: Lint SQL
        run: make lint-sql

      - name: Run Python unit tests (tuva_ingest package)
        run: make test-unit

      - name: Prepare dbt profile (env-var-driven, no real credentials -- see profiles.example.yml)
        run: cp profiles.example.yml profiles.yml

      - name: Parse dbt project (no database connection attempted)
        run: uv run dbt parse --project-dir . --profiles-dir . --target ci
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: tuva

  integration:
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tuva
        options: >-
          --health-cmd "pg_isready -U postgres -d tuva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tuva
      PG_DSN: postgresql://postgres:postgres@localhost:5432/tuva
      RAW_SCHEMA: raw
      OPS_SCHEMA: ingest_ops
      INPUT_LAYER_SCHEMA: input_layer
      INGEST_ROLE: tuva_ingest_role
      TRANSFORM_ROLE: tuva_transform_role
      DBT_TARGET: ci
      DBT_PROFILES_DIR: "."
      DBT_PROJECT_DIR: "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install locked Python tooling (includes dbt-core, dbt-postgres)
        run: uv sync --locked

      - name: Prepare dbt profile (env-var-driven, no real credentials -- see profiles.example.yml)
        run: cp profiles.example.yml profiles.yml

      - name: Wait for Postgres & sanity check
        run: |
          for i in {1..30}; do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" && break
            sleep 1
          done
          psql "$PG_DSN" -c "SELECT version();"

      - name: Apply operational migrations (001-003), twice, to prove idempotency
        run: |
          uv run tuva-ingest migrate
          uv run tuva-ingest migrate --status
          uv run tuva-ingest migrate
          uv run tuva-ingest migrate --status

      - name: Fetch the pinned Tuva package (dbt deps)
        run: uv run dbt deps --project-dir . --profiles-dir . --target ci

      - name: Run the full disposable-database integration suite
        # migrations idempotency (re-applied above), raw fixture loading
        # (twice, proving no duplication), rollback-on-failure, state
        # transitions, and -- since dbt is now on PATH and deps succeeded
        # above -- a real `dbt build` proving raw fixtures -> staging ->
        # Input Layer -> the pinned Tuva package's own models. See
        # tests/integration/test_pipeline_integration.py's module
        # docstring for the complete list of what this proves. This step
        # must not skip: PG_DSN is set and psycopg/dbt are installed, so
        # every test in the module runs for real -- `-rs` prints a
        # one-line summary of any skip, and the job fails outright if
        # one occurred (defense in depth against a silently-skipping
        # integration suite: a skip here would mean a real bug in the
        # test module's guard conditions, not a legitimate environment
        # limitation, since both PG_DSN and dbt are available).
        run: |
          set -o pipefail
          uv run pytest tests/integration -v -rs 2>&1 | tee /tmp/pytest-integration.log
          if grep -q "SKIPPED" /tmp/pytest-integration.log; then
            echo "::error::tests/integration reported a SKIPPED test in a job with a live PG_DSN and dbt installed."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tuva-ingest:ci-smoke .

      - name: Run --version smoke test
        run: docker run --rm tuva-ingest:ci-smoke --version

      - name: Validate compose.yml renders
        run: docker compose config > /dev/null
