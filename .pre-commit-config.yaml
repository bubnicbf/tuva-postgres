repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]  # avoid committing giant zips
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # check-toml/check-yaml live here (not sirosen/check-jsonschema below,
      # which does not provide these hook IDs) -- see
      # https://github.com/sirosen/check-jsonschema/blob/main/.pre-commit-hooks.yaml
      - id: check-toml
      - id: check-yaml
  - repo: local
    hooks:
      - id: sqlfluff-psql-fix
        name: sqlfluff-fix (psql-aware wrapper; manual only)
        entry: bash scripts/sqlfluff_psql_wrapper.sh format
        language: system
        pass_filenames: true
        stages: [manual]
        files: \.sql$
