# Persistent storage for the immutable raw landing directory (RAW_DATA_DIR,
# see src/tuva_postgres/landing.py). ReadWriteOnce is sufficient because
# cronjob.yaml sets concurrencyPolicy: Forbid, so at most one pod ever
# writes here at a time. Raw snapshots are never auto-deleted by the
# pipeline (see docs/RUNBOOK.md for the operator-owned retention policy),
# so size this generously and monitor free space (see the recommended
# "raw storage nearing capacity" alert in docs/RUNBOOK.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuva-postgres-raw-data
  labels:
    app.kubernetes.io/name: tuva-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Starting point only -- size for your actual snapshot volume and
      # retention window, then grow (most CSI drivers support online PVC
      # expansion) rather than under-provisioning.
      storage: 50Gi
  # storageClassName intentionally omitted -- uses the cluster default.
  # Set explicitly if your cluster requires it.
