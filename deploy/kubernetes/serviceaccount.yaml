# Dedicated, otherwise-unprivileged ServiceAccount for the pipeline pod.
# No Role/RoleBinding is created because the pipeline never calls the
# Kubernetes API -- it only talks to Postgres and the configured
# TUVA_API_MANIFEST_URL.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuva-postgres
  labels:
    app.kubernetes.io/name: tuva-postgres
automountServiceAccountToken: false
