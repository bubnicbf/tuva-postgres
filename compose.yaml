# Local development/testing stack: a disposable Postgres + the pipeline
# container built from ./Dockerfile. NOT for production use -- there is
# no TLS, no backup/HA, and no production secret management here; the
# Postgres credentials below are clearly-labeled, local-only placeholders
# that must never be reused outside a developer's own machine. See
# docs/RUNBOOK.md for production deployment (deploy/kubernetes/), which
# is a completely separate path from this file.
#
# One-command workflow (see the Makefile's `local-db-*` targets and
# README.md's "Local PostgreSQL with Docker Compose" section for the
# full walkthrough):
#
#   make local-db-ready     # start postgres, wait for health, apply migrations
#   make local-db-status    # container state + migration status (read-only)
#   make local-db-shell     # psql against the local database
#   make local-db-logs      # follow postgres logs
#   make local-db-down      # stop containers, KEEP the data volume
#   make local-db-reset     # DESTRUCTIVE: drop the local data volume too
#
# Equivalent raw `docker compose` commands, if you'd rather not go
# through make:
#
#   docker compose up -d postgres              # start just the database
#   docker compose run --rm migrate            # apply migrations (safe: DB-only)
#   docker compose run --rm pipeline healthcheck
#   TUVA_API_MANIFEST_URL=... TUVA_API_TOKEN=... docker compose run --rm pipeline run
#
# `pipeline run` additionally requires a real (or locally-mocked)
# TUVA_API_MANIFEST_URL -- this compose file does not stand one up, since
# the point of the manifest contract (docs/API_MANIFEST.md) is that it's
# vendor-agnostic and this repo does not assume a specific upstream host.
# For an end-to-end local rehearsal of `run`, point TUVA_API_MANIFEST_URL
# at an in-process mock server the way tests/unit/test_orchestrator.py
# and tests/integration do. Neither `docker compose up` (bare) nor any
# `local-db-*` target ever requires TUVA_API_MANIFEST_URL/TUVA_API_TOKEN.

x-tuva-build: &tuva-build
  context: .
  dockerfile: Dockerfile

# Shared DB connection settings for every service that talks to the local
# database (the pipeline container and the one-shot migrate service).
# Defined once so the local-only DSN/credentials/schema names never drift
# between them -- both anchors are local-development-only values (see the
# POSTGRES_* block below), never production configuration.
x-tuva-db-env: &tuva-db-env
  PG_DSN: postgresql://tuva_local:local-only-example-password-change-me@postgres:5432/tuva
  PG_SCHEMA: tuva
  TERMINOLOGY_SCHEMA: tuva_term
  OPS_SCHEMA: tuva_ops

services:
  postgres:
    # Pinned to the same major version this repository's CI validates
    # against (see .github/workflows/ci.yml's `postgres:16` service).
    # Prefer a pinned tag over `latest` so local behavior stays
    # reproducible across machines and over time.
    image: postgres:16
    environment:
      # LOCAL-ONLY EXAMPLE CREDENTIALS -- never used outside this compose
      # file's disposable container; production credentials are supplied
      # via a Kubernetes Secret (see deploy/kubernetes/secret.example.yaml)
      # and are never committed anywhere. Do not reuse this password for
      # anything beyond a developer's own machine.
      POSTGRES_USER: tuva_local
      POSTGRES_PASSWORD: local-only-example-password-change-me
      POSTGRES_DB: tuva
    ports:
      # Loopback-only: never bind Postgres to all interfaces (0.0.0.0).
      # Host port is configurable (POSTGRES_PORT) so it doesn't collide
      # with a developer's own local Postgres already using 5432; the
      # *container* port always stays Postgres's normal 5432 regardless.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuva_local -d tuva"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Local-dev convenience only: restart if it crashes, but never loop
    # indefinitely trying to start (that's `on-failure`'s job, not
    # `always`, and this is explicitly not a production restart policy).
    restart: on-failure

  # One-shot migration runner: applies the repository's real, checksum-
  # protected migrations (src/tuva_postgres/migrations.py via `tuva-
  # postgres migrate`) against the local database, then exits. This is
  # deliberately NOT an initdb.d script -- application-managed schema
  # must only ever be created by the authoritative migration runner, so
  # local Postgres behaves identically to every other environment.
  # Idempotent and safe to rerun (`make local-db-migrate` / `docker
  # compose run --rm migrate`); already-applied migrations are skipped.
  migrate:
    build: *tuva-build
    depends_on:
      postgres:
        condition: service_healthy
    environment: *tuva-db-env
    command: ["migrate"]
    # Never restart: this container is meant to run once and exit 0 (or
    # exit nonzero on failure, which `local-db-migrate` surfaces as-is).
    restart: "no"

  pipeline:
    build: *tuva-build
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for a clean migration run before the pipeline container's
      # own (default) healthcheck invocation, so `docker compose up`
      # reports meaningful status instead of racing schema creation.
      # Requires Docker Compose v2 (the `service_completed_successfully`
      # condition) -- verified against `docker compose config` as part
      # of this repository's structural/integration tests.
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *tuva-db-env
      PIPELINE_ENVIRONMENT: local
      PIPELINE_MAX_SUCCESS_AGE_HOURS: "30"
      LOG_LEVEL: INFO
      RAW_DATA_DIR: /app/data/raw
      METRICS_FILE: /app/data/metrics/tuva_postgres.prom
      # Not set here on purpose (see usage note above): TUVA_API_MANIFEST_URL,
      # TUVA_API_TOKEN. Supply them on the command line or a local .env
      # file (never committed) to run `pipeline run` end to end.
    volumes:
      - raw-data:/app/data/raw
      - metrics-data:/app/data/metrics
    # Safe default for `docker compose up`: only needs the database, never
    # the (unset-by-default) API credentials. Override with `run` once
    # TUVA_API_MANIFEST_URL/TUVA_API_TOKEN are supplied.
    command: ["healthcheck"]
    restart: "no"

volumes:
  pgdata:
  raw-data:
  metrics-data:
