name: CI (Postgres + SQL smoke tests)

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  push:
  pull_request:

jobs:
  sql-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tuva
        options: >-
          --health-cmd "pg_isready -U postgres -d tuva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tuva
      PG_DSN: postgresql://postgres:postgres@localhost:5432/tuva
      PG_SCHEMA: tuva
      TERMINOLOGY_SCHEMA: tuva_term
      # Deterministic per-run id -- every SQL-validation-result query in
      # this workflow is scoped to this exact id (never "whichever run_id
      # happens to sort latest"), so a stale row from an earlier run can
      # never be mistaken for this run's evidence.
      CI_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (psql + python)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client python3

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install locked Python tooling (ruff, mypy, pytest, sqlfluff, pre-commit)
        run: uv sync --locked

      - name: Verify locked Python toolchain
        run: make check-python-deps

      - name: Ensure scripts are executable
        run: |
          chmod +x scripts/*.sh || true
          chmod +x scripts/*.py || true

      - name: Create .env for Makefile/scripts
        run: |
          cat > .env << 'EOF'
          export PG_DSN="postgresql://postgres:postgres@localhost:5432/tuva"
          export PG_SCHEMA="tuva"
          export TERMINOLOGY_SCHEMA="tuva_term"
          export OPS_SCHEMA="tuva_ops"
          export DATA_DIR="tests/fixtures/ci/complete_snapshot"
          EOF
          cat .env

      - name: Lint Python (ruff check)
        run: make lint-python

      - name: Check Python formatting (ruff format --check)
        run: make format-python-check

      - name: Type check Python (mypy)
        run: make typecheck

      - name: Run Python unit tests (tuva_postgres package)
        run: make test-unit

      - name: Validate CI fixture (database-free)
        # Runs before any database-dependent step: catches a missing,
        # incomplete, malformed, or drifted committed fixture immediately,
        # without waiting on Postgres to come up first.
        run: uv run python3 scripts/tests/test_ci_fixture.py

      - name: Wait for Postgres & sanity check
        run: |
          for i in {1..30}; do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" && break
            sleep 1
          done
          psql "$PG_DSN" -c "SELECT version();"

      - name: Run database-free structural test suite (test-shell)
        run: make test-shell

      - name: Run complete migrate -> load -> validate -> verify sequence
        # A single, deterministic RUN_ID (CI_RUN_ID, from job-run
        # metadata -- see the `env:` block above) flows through the SQL
        # validation run and into scripts/verify_complete_run.py, so
        # every result queried below is unambiguously tied to *this* run,
        # never a stale row left over from an earlier one. See `make
        # test-ci-complete-run` (Makefile) for exactly what this proves:
        # migrations apply, the committed fixture (tests/fixtures/ci/
        # complete_snapshot/, set as DATA_DIR above -- never the plain
        # data/ directory) loads through the real loader (never its
        # zero-file no-op path), every managed table gets its expected
        # row count, the full db/tests/*.sql suite executes, and
        # scripts/verify_complete_run.py confirms zero failures, every
        # expected suite represented, and current migration status.
        run: make test-ci-complete-run RUN_ID=${{ env.CI_RUN_ID }}

      - name: Publish summary to job log
        run: |
          declare -a MANAGED_TABLES=(
            practitioner location patient encounter person_id_crosswalk
            medical_claim pharmacy_claim eligibility procedure observation
            lab_result condition medication immunization appointment
          )

          echo "## SQL Test Summary (run_id=${CI_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "### Managed table row counts"
            echo ""
            echo '```'
            for t in "${MANAGED_TABLES[@]}"; do
              count="$(psql "$PG_DSN" -At -c "SELECT COUNT(*) FROM \"${PG_SCHEMA}\".\"${t}\";")"
              echo "${t}=${count}"
            done
            echo '```'
            echo ""
            echo "### Per-suite breakdown"
            echo ""
            echo '```'
            psql "$PG_DSN" -c "SELECT * FROM ${PG_SCHEMA}.v_test_summary WHERE run_id = '${CI_RUN_ID}' ORDER BY suite;"
            echo '```'
            echo ""
            echo "### Failures (if any -- expect none; make test-ci-complete-run already failed the job above otherwise)"
            echo ""
            echo '```'
            psql "$PG_DSN" -c "SELECT * FROM ${PG_SCHEMA}.v_test_failures WHERE run_id = '${CI_RUN_ID}' ORDER BY suite, test;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            tmp/test_results/
          if-no-files-found: warn
          retention-days: 14

      - name: Run migration + mock-API pipeline integration tests
        run: make test-integration

      - name: Build production image and run container smoke test
        run: make test-container

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Validate Kubernetes deployment manifests (structural + client dry-run, never applied)
        run: make test-deploy

      - name: Lint SQL
        run: make lint-sql

