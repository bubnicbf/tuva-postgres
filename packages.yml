# The official Tuva dbt package, pinned to exactly the stable 0.18.0
# release (https://github.com/tuva-health/tuva/releases/tag/v0.18.0 --
# see README.md "Architecture" for how this version was confirmed).
# Never main/latest/a floating range/an older release -- upgrading is a
# deliberate, reviewed action (see README.md "Upgrading beyond 0.18.0").
#
# dbt_utils is declared directly (rather than relying on it arriving
# transitively via the Tuva package) because models/final/schema.yml
# uses dbt_utils.unique_combination_of_columns, and direct declaration
# keeps that dependency explicit and independently reproducible.
packages:
  - package: tuva-health/the_tuva_project
    version: 0.18.0
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]
