# dbt project for the tuva_ingest connector: maps raw claims data (loaded
# by src/tuva_ingest/raw_loader.py into the configured raw schema) into
# the Tuva Input Layer, which the pinned tuva-health/the_tuva_project
# package (see packages.yml, release 0.18.0) then builds into Tuva's
# core data model, terminology sets, and data marts.
#
# Four-layer lineage, each with strictly separated responsibilities
# (see README.md "Architecture" for the full narrative):
#
#   raw.{eligibility,medical_claim,pharmacy_claim} (source, see
#   models/sources.yml -- exact source fidelity only; no transformation)
#     -> models/staging/*.sql (row-local rename/trim/cast/unit-conversion
#        only -- never joins, dedup, crosswalk resolution, or multi-row
#        business rules)
#     -> models/intermediate/*.sql (owns every join, dedup, member
#        crosswalk resolution, eligibility-span consolidation, and claim
#        lifecycle/adjustment/void handling -- seeds/member_crosswalk_seed.csv
#        is this layer's interim crosswalk source; see
#        models/intermediate/int_member_crosswalk.sql)
#     -> models/final/{eligibility,medical_claim,pharmacy_claim}.sql (thin
#        Tuva Input Layer contract projections -- explicit column
#        selection/casting only, the model Tuva's package ref()s by name)
#     -> the Tuva package's own models (dbt_packages/the_tuva_project/,
#        never duplicated or vendored into this repository).
name: "tuva_ingest_connector"
version: "1.0.0"
config-version: 2

profile: "tuva_ingest"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests/dbt"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Required by Tuva 0.18.0 (see README.md's "Getting Started with Real
# Data" walkthrough at https://thetuvaproject.com/getting-started):
# aligns dbt's ref() resolution with dbt 1.11 behavior so the Tuva
# package can ref() this project's Input Layer models (models/final/)
# without a "could not find model, but there is an unmatched model with
# the same name" warning.
flags:
  require_ref_searches_node_package_before_root: true

vars:
  # Six-schema lineage (see docs/SOURCE_CONTRACT.md "Schema lineage" and
  # config.py's IngestConfig -- these defaults are kept in sync with that
  # module's own RAW_SCHEMA/OPS_SCHEMA/STAGING_SCHEMA/INPUT_LAYER_SCHEMA/
  # ANALYTICS_CORE_SCHEMA/ANALYTICS_MARTS_SCHEMA defaults). Always pass
  # --vars (or rely on the CLI's `tuva-ingest dbt`/`tuva-ingest run`,
  # which does this for you from IngestConfig) rather than hard-coding a
  # deployment-specific schema name here.
  #
  # Read by models/sources.yml and models/staging/*.sql -- the schema
  # both the legacy raw_loader.py and the new object_raw_loader.py load
  # eligibility/medical_claim/pharmacy_claim into.
  raw_schema: raw_incoming
  # Read by the custom generate_schema_name macro (see
  # macros/generate_schema_name.sql) for models/staging/* -- the schema
  # dbt's staging (cast/normalize/dedupe) models materialize into.
  staging_schema: staging_incoming
  # Read by the custom generate_schema_name macro (see
  # macros/generate_schema_name.sql) for models/final/* -- the schema the
  # Tuva Input Layer models are materialized into, and therefore the
  # schema the Tuva package's own sources.yml-equivalent ref() calls
  # resolve against.
  input_layer_schema: input_layer
  # Read by generate_schema_name.sql's Tuva-package-routing heuristic
  # (see that macro's own docstring for exactly how, and its documented
  # "best-effort, unverified without `dbt deps`" caveat) -- routes the
  # pinned Tuva package's own `core`/`terminology` schema output into
  # analytics_core_schema, and every other Tuva-package schema (its
  # various mart schemas) into analytics_marts_schema.
  analytics_core_schema: analytics_core
  analytics_marts_schema: analytics_marts

  # Tuva 0.18.0 domain enablement (see README.md "dbt Variables" /
  # https://thetuvaproject.com/getting-started and
  # https://github.com/tuva-health/tuva#dbt-variables for the package's
  # own defaults). This connector is claims-first: eligibility,
  # medical_claim, and pharmacy_claim are the three Input Layer tables
  # it maps (see models/final/), each exposing the domain's FULL
  # Tuva 0.18.0 column contract -- never a partial one.
  #
  # clinical_enabled/provider_attribution_enabled/semantic_layer_enabled
  # stay false because this connector does not implement those domains'
  # Input Layer model sets. Per the Input Layer contract, a domain must
  # never be enabled while only part of its interface is implemented --
  # see tests/unit/test_dbt_project_contract.py for the test that
  # enforces this rule, and README.md "How to add another Tuva domain
  # safely" for the procedure to follow when one of these is turned on
  # for real.
  claims_enabled: true
  clinical_enabled: false
  provider_attribution_enabled: false
  semantic_layer_enabled: false

models:
  tuva_ingest_connector:
    staging:
      +schema: "{{ var('staging_schema') }}"
      +materialized: view
      +tags: ["input_layer"]
      +docs:
        node_color: "#8BC34A"
    # models/intermediate/*.sql: joins, member-crosswalk resolution,
    # eligibility-span consolidation, and claim lifecycle handling (see
    # README.md "Architecture" and each model's own header). Shares the
    # same configurable staging_schema var as models/staging/*.sql --
    # per this repository's own architecture, a separate physical schema
    # buys nothing operationally (both layers are internal, never
    # ref()'d by the Tuva package itself, which only ever resolves
    # models/final/*.sql by name), while the *logical* dbt layer stays
    # fully distinct via the models/intermediate/ directory, its own
    # int_ naming convention, and its own schema.yml. Also tagged
    # input_layer (not just staging/final) so `dbt build --select
    # tag:input_layer` builds this connector's complete DAG -- raw's
    # source rows all the way through to the Input Layer contract -- in
    # one pass from an empty database, exactly like staging/final
    # already do (see that var's own comment on the staging block above,
    # and tuva-health/connector_template, which tags all of its
    # transformation layers this same way for the same reason).
    intermediate:
      +schema: "{{ var('staging_schema') }}"
      +materialized: view
      +tags: ["input_layer"]
      +docs:
        node_color: "#FF9800"
    final:
      +schema: "{{ var('input_layer_schema') }}"
      +materialized: table
      +tags: ["input_layer"]
      +docs:
        node_color: "#2196F3"
  # The pinned Tuva package's own models are enabled/disabled entirely
  # through its own `claims_enabled`/`clinical_enabled`/
  # `provider_attribution_enabled`/`semantic_layer_enabled` vars above --
  # this project never overrides materializations or schemas for
  # the_tuva_project's models, and never duplicates any of its model
  # files locally (see README.md "This repository does not own Tuva's
  # DDL"). Both `staging` and `final` (not just `final`) carry the
  # `input_layer` tag: `dbt build --select tag:input_layer` must be able
  # to build the connector's models from an empty database in one pass,
  # and the final Input Layer models ref() the staging models -- see
  # tuva-health/connector_template, which tags all three of its
  # transformation layers this same way for exactly this reason.

seeds:
  tuva_ingest_connector:
    # seeds/member_crosswalk_seed.csv: the interim, versioned,
    # deterministic member_key -> person_id crosswalk consumed by
    # models/intermediate/int_member_crosswalk.sql. See that model's
    # header for why a seed (not a fabricated raw source/loader) is the
    # right stand-in until a real vendor crosswalk feed exists. Same
    # physical schema as staging/intermediate for the same reason
    # documented on the intermediate models block above.
    member_crosswalk_seed:
      +schema: "{{ var('staging_schema') }}"
      # Tagged input_layer, same as staging/intermediate/final, so that
      # `dbt build --select tag:input_layer` -- this connector's
      # documented one-pass, empty-database build target (see Makefile's
      # dbt-input-layer target and README.md "Validation order") --
      # actually loads this seed before models/intermediate/
      # int_member_crosswalk.sql tries to ref() it. Without this tag,
      # a tag-scoped selection would build the intermediate/final models
      # against a crosswalk table that was never seeded.
      +tags: ["input_layer"]
      +docs:
        node_color: "#9E9E9E"
