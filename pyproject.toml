[project]
name = "tuva-postgres"
version = "0.1.0"
description = "Reproducible PostgreSQL load of Tuva seed datasets"
requires-python = ">=3.12"
# Minimal, deliberate runtime dependency set for the src/tuva_postgres
# ingestion pipeline (API client + streaming downloads, PostgreSQL driver
# for migrations/orchestration). Structured logging and the CLI are
# stdlib-only (argparse + the json logging module) -- see
# src/tuva_postgres/logging_utils.py and cli.py.
dependencies = [
  "requests==2.34.2",
  "psycopg[binary]==3.2.3",
]

[project.scripts]
tuva-postgres = "tuva_postgres.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

# Exact-pinned so the local package's own build (an editable install, via
# `uv sync`/`uv sync --locked`) is reproducible too -- not just the
# runtime/dev dependency set below. See the "all direct dependencies are
# reproducible" contract described in README.md's Python tooling section.
[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

# Dev/tooling only -- the full locked quality toolchain (see README.md's
# "Python development and quality tooling" section for the day-to-day
# commands): Ruff (lint + format), mypy (static typing), pytest (test
# runner for both tests/unit and tests/integration -- see
# [tool.pytest.ini_options] below), SQLFluff + pre-commit (already
# present), and PyYAML (already a transitive dependency of both sqlfluff
# and pre-commit -- see uv.lock -- declared directly only so the
# structural tests that parse compose.yaml / deploy/kubernetes/*.yaml /
# ci.yml run for real via `make test-unit` / CI instead of skipping).
# types-requests is the one type-stub package mypy genuinely needs, for
# the `requests` runtime dependency's public API surface used by
# src/tuva_postgres/api_client.py.
#
# Every entry here is an exact `==` pin, resolved via `uv lock` and
# installed only through `uv sync --locked` -- never an ad hoc
# `pip install`. See README.md for the intentional-update procedure.
[dependency-groups]
dev = [
  "ruff==0.14.4",
  "mypy==1.19.0",
  "pytest==8.4.2",
  "types-requests==2.34.2.20250809",
  "pre-commit==4.6.2",
  "sqlfluff==4.3.0",
  "pyyaml==6.0.3",
]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "jinja"
max_line_length = 120

# Templater & indentation style for readable JOINs / ON
[tool.sqlfluff.indentation]
indented_joins = false
indented_using_on = true
template_blocks_indent = false  # keep Jinja blocks flush. :contentReference[oaicite:0]{index=0}

[tool.sqlfluff.templater]
unwrap_wrapped_queries = true

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true  # makes {{ ref() }}, {{ var() }} etc. safe if you add dbt later. :contentReference[oaicite:1]{index=1}

# Global rule knobs (common conveniences)
[tool.sqlfluff.rules]
single_table_references = "consistent"  # aligns with L028
unquoted_identifiers_policy = "all"     # allow linting all unquoted idents. :contentReference[oaicite:2]{index=2}

# Casing
[tool.sqlfluff.rules.capitalisation.keywords]   # L010
capitalisation_policy = "upper"                  # SELECT, FROM, etc. :contentReference[oaicite:3]{index=3}

[tool.sqlfluff.rules.capitalisation.identifiers]  # L014
extended_capitalisation_policy = "snake"          # e.g., encounter_id, tuva_last_run. :contentReference[oaicite:4]{index=4}

# Line length / layout
[tool.sqlfluff.rules.layout.long_lines] # L016
ignore_comment_lines = true             # keep long comment lines out of the way. :contentReference[oaicite:5]{index=5}

[tool.sqlfluff.rules.layout.commas]     # L019
comma_style = "trailing"                # consistent trailing commas. :contentReference[oaicite:6]{index=6}

[tool.sqlfluff.rules.layout.functions]  # L017
# (no extra opts) enforce sum(a) not sum (a). :contentReference[oaicite:7]{index=7}

[tool.sqlfluff.rules.layout.cte_bracket]  # L018
# WITH (...) newline alignment. :contentReference[oaicite:8]{index=8}

[tool.sqlfluff.rules.layout.cte_newline]  # L022
# blank line after CTE. :contentReference[oaicite:9]{index=9}

[tool.sqlfluff.rules.layout.select_modifiers]  # L041
# SELECT DISTINCT on same line. :contentReference[oaicite:10]{index=10}

[tool.sqlfluff.rules.layout.select_targets]    # L036
wildcard_policy = "single"   # keep * usage sane. :contentReference[oaicite:11]{index=11}

[tool.sqlfluff.rules.layout.set_operators]     # L065
# UNION/EXCEPT on their own lines. :contentReference[oaicite:12]{index=12}

# References & joins
[tool.sqlfluff.rules.references.qualification]    # L027
# qualify columns if >1 table in SELECT. :contentReference[oaicite:13]{index=13}

[tool.sqlfluff.rules.references.consistent]       # L028
single_table_references = "consistent"            # consistent qualifying in 1-table queries. :contentReference[oaicite:14]{index=14}

[tool.sqlfluff.rules.references.quoting]          # L059
prefer_quoted_identifiers = false                 # only quote when necessary. :contentReference[oaicite:15]{index=15}

[tool.sqlfluff.rules.structure.subquery]          # L042
forbid_subquery_in = "join"                       # prefer CTEs vs subqueries in JOINs. :contentReference[oaicite:16]{index=16}

# --- pytest --------------------------------------------------------------
# pytest is the runner for both tests/unit (database-free) and
# tests/integration (requires a disposable PostgreSQL database, see
# tests/integration/test_pipeline_integration.py's module docstring).
# Both suites are unittest.TestCase-based (pytest collects and runs them
# natively -- see https://docs.pytest.org/en/stable/how-to/unittest.html
# -- no rewrite needed); `make test-unit`/`make test-integration` invoke
# pytest against each directory separately so a plain unit-test run can
# never accidentally depend on, or connect to, a database.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
markers = [
  "integration: requires a disposable PostgreSQL database (see tests/integration/test_pipeline_integration.py)",
]

# --- Ruff (lint + format) --------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts"]
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "*.egg-info",
  "__pycache__",
  ".git",
  "tmp",
  "data",
]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle import/statement/syntax errors. F: pyflakes
# (undefined names, unused imports, etc.). I: import sorting (isort
# rules). UP: pyupgrade (obsolete constructs for the declared py312
# target-version). B: flake8-bugbear (likely bug patterns). Deliberately
# not a huge, mostly-suppressed rule set -- this is the narrow,
# meaningful starting point the task calls for; expand only when the
# repository can support additions without unrelated churn.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# tests/**/*.py and scripts/tests/*.py deliberately do
# `sys.path.insert(0, ...)` before importing tuva_postgres (see each
# file's own module docstring/comment) -- this is how they find
# src/tuva_postgres without requiring an editable install first, and is
# load-bearing, not an oversight. E402 (module-level import not at top
# of file) would otherwise flag every one of these files for a pattern
# they use intentionally and consistently.
"tests/**/*.py" = ["E402"]
"scripts/tests/*.py" = ["E402"]

[tool.ruff.format]
# Explicit even though these match Ruff's own defaults, so the choice is
# visible in configuration rather than implicit.
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# --- mypy ------------------------------------------------------------------
# Applied primarily to production code (src/tuva_postgres) -- see `files`
# below, which must match what `make typecheck`/CI/pre-commit actually
# check. This is the strongest configuration the codebase can plausibly
# pass without disallow_untyped_defs (several functions, mostly ones
# taking a psycopg connection, intentionally leave a couple of parameters
# unannotated rather than typed as Any -- see src/tuva_postgres/ops.py) --
# not full strict mode. No ignore_errors, no blanket
# ignore_missing_imports, and no directory-wide exclusions: every module
# under src/tuva_postgres is checked.
[tool.mypy]
python_version = "3.12"
files = ["src/tuva_postgres"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
pretty = true
