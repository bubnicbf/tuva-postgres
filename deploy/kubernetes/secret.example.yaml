# TEMPLATE ONLY -- this is not a real Secret and must never contain real
# credentials. Deliberately excluded from kustomization.yaml's resource
# list so `kubectl kustomize .` never renders an applyable fake secret.
#
# To use: copy this file (do not edit it in place), fill in real values
# through your cluster's secret-management process, and never commit the
# copy. For example:
#
#   kubectl create secret generic tuva-postgres-secret \
#     --from-literal=PG_DSN='postgresql://user:REDACTED@prod-postgres:5432/tuva' \
#     --from-literal=TUVA_API_TOKEN='REDACTED' \
#     --namespace tuva-postgres
#
# or via a sealed-secrets / External Secrets Operator pipeline that never
# stores plaintext in git.
apiVersion: v1
kind: Secret
metadata:
  name: tuva-postgres-secret
  labels:
    app.kubernetes.io/name: tuva-postgres
type: Opaque
stringData:
  PG_DSN: "REPLACE_ME_NEVER_COMMIT_REAL_VALUE"
  TUVA_API_TOKEN: "REPLACE_ME_NEVER_COMMIT_REAL_VALUE"
