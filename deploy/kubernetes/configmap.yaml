# Non-secret pipeline configuration (see scripts/setup_env.example for the
# full, documented list of environment variables and
# src/tuva_postgres/config.py for validation rules). PG_DSN and
# TUVA_API_TOKEN are secrets and live in a real Secret instead -- see
# secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tuva-postgres-config
  labels:
    app.kubernetes.io/name: tuva-postgres
data:
  # --- API client -------------------------------------------------------
  # Replace with the real, environment-specific manifest URL (see
  # docs/API_MANIFEST.md). Must be HTTPS in any non-local environment --
  # TUVA_API_ALLOW_INSECURE_HTTP defaults to false and is deliberately not
  # set here.
  TUVA_API_MANIFEST_URL: "https://REPLACE_ME.example.invalid/tuva/manifest.json"
  TUVA_API_TIMEOUT_SECONDS: "30"
  TUVA_API_MAX_RETRIES: "5"

  # --- Raw landing / database ---------------------------------------------
  RAW_DATA_DIR: "/app/data/raw"
  PG_SCHEMA: "tuva"
  TERMINOLOGY_SCHEMA: "tuva_term"
  OPS_SCHEMA: "tuva_ops"

  # --- Pipeline / observability -------------------------------------------
  PIPELINE_ENVIRONMENT: "production"
  PIPELINE_MAX_SUCCESS_AGE_HOURS: "30"
  LOG_LEVEL: "INFO"
  METRICS_FILE: "/app/data/metrics/tuva_postgres.prom"
  # scripts/load_to_postgres.sh and scripts/run_tests.sh write temp files
  # under $TMPDIR (default /tmp); pointed at the writable, PVC-backed-free
  # emptyDir mounted in cronjob.yaml so it works under
  # readOnlyRootFilesystem: true.
  TMPDIR: "/app/tmp"
